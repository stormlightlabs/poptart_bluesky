name: poptart_bluesky_text
description: Text parsing and rich-text facet helpers for Bluesky posts, ported for Poptart.
version: 0.1.0
homepage: https://poptart.xyz
repository: https://github.com/stormlightlabs/poptart_bluesky/tree/main/packages/poptart_bluesky_text
issue_tracker: https://github.com/stormlightlabs/poptart_bluesky/issues

environment:
  sdk: ">=3.8.0 <4.0.0"

topics:
  - atproto
  - bluesky
  - util

dependencies:
  poptart_xrpc: ^0.1.0
  characters: ^1.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  freezed: ^3.2.0
  import_sorter: ^4.6.0
